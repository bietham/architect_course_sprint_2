name: Docker Build, Push & API Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, cinema ]
    paths:
      - 'src/**'
      - 'docker-compose.yml'
      - 'tests/postman/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  # фиксируем имя проекта для предсказуемого имени сети: cinemaabyss_default
  COMPOSE_PROJECT_NAME: cinemaabyss

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------- metadata (tags/labels) ----------
      - name: Meta - monolith
        id: meta-monolith
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/monolith
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short

      - name: Meta - movies-service
        id: meta-movies
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/movies-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short

      - name: Meta - events-service
        id: meta-events
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/events-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short

      - name: Meta - proxy-service
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/proxy-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short

      # --------- build & push ----------
      - name: Build & push - monolith
        uses: docker/build-push-action@v6
        with:
          context: ./src/monolith
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push - movies-service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/movies
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push - events-service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/events
          push: true
          tags: ${{ steps.meta-events.outputs.tags }}
          labels: ${{ steps.meta-events.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push - proxy-service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------- infra up (postgres) ----------
      - name: Compose Up (postgres only)
        run: docker compose up -d postgres

      - name: Wait for Postgres to accept connections
        run: |
          tries=0
          until docker compose exec -T postgres pg_isready -U postgres -d postgres; do
            tries=$((tries+1)); [ $tries -gt 60 ] && exit 1; sleep 2;
          done

      # --------- ensure DB + schema present (идемпотентно) ----------
      - name: Create DB cinemaabyss if missing
        run: |
          # создаём БД (если уже есть — игнорируем ошибку)
          docker compose exec -T postgres psql -U postgres -d postgres -c "CREATE DATABASE cinemaabyss" || true

      - name: Apply init.sql if present (postgres & cinemaabyss)
        run: |
          # если в образе/томе есть init.sql — применим его явно
          docker compose exec -T postgres bash -lc 'ls /docker-entrypoint-initdb.d/*.sql 2>/dev/null | xargs -r -I{} psql -U postgres -d postgres -f "{}"'
          docker compose exec -T postgres bash -lc 'ls /docker-entrypoint-initdb.d/*.sql 2>/dev/null | xargs -r -I{} psql -U postgres -d cinemaabyss -f "{}"'

      - name: Bootstrap minimal schema (idempotent)
        run: |
          cat > /tmp/bootstrap.sql <<'SQL'
          CREATE TABLE IF NOT EXISTS public.users (
            id SERIAL PRIMARY KEY,
            name TEXT,
            email TEXT
          );
          CREATE TABLE IF NOT EXISTS public.movies (
            id SERIAL PRIMARY KEY,
            title TEXT,
            genre TEXT,
            year INT
          );
          CREATE TABLE IF NOT EXISTS public.payments (
            id SERIAL PRIMARY KEY,
            user_id INT,
            amount NUMERIC
          );
          CREATE TABLE IF NOT EXISTS public.subscriptions (
            id SERIAL PRIMARY KEY,
            user_id INT,
            plan TEXT
          );
          SQL
          # применяем в обе БД на случай разных настроек сервисов
          docker compose exec -T postgres psql -U postgres -d postgres -f /dev/stdin < /tmp/bootstrap.sql
          docker compose exec -T postgres psql -U postgres -d cinemaabyss -f /dev/stdin < /tmp/bootstrap.sql

      - name: Verify tables exist (any target DB)
        run: |
          check() {
            docker compose exec -T postgres psql -U postgres -d "$1" -tAc \
              "SELECT
                 (to_regclass('public.users') IS NOT NULL) AND
                 (to_regclass('public.movies') IS NOT NULL) AND
                 (to_regclass('public.payments') IS NOT NULL) AND
                 (to_regclass('public.subscriptions') IS NOT NULL);" | grep -q t
          }
          tries=0
          until check postgres || check cinemaabyss; do
            tries=$((tries+1)); [ $tries -gt 30 ] && (echo "schema not ready"; exit 1); sleep 2;
          done

      # --------- rest infra + services ----------
      - name: Compose Up (zookeeper & kafka)
        run: docker compose up -d zookeeper kafka

      - name: Compose Up (services)
        run: docker compose up -d --build monolith movies-service events-service proxy-service

      - name: Wait for services (in compose network)
        run: |
          NET="${COMPOSE_PROJECT_NAME}_default"
          docker run --rm --network="$NET" curlimages/curl:8.10.1 -sSf http://monolith:8080/health
          docker run --rm --network="$NET" curlimages/curl:8.10.1 -sSf http://movies-service:8081/api/movies/health
          docker run --rm --network="$NET" curlimages/curl:8.10.1 -sSf http://events-service:8082/api/events/health
          docker run --rm --network="$NET" curlimages/curl:8.10.1 -sSf http://proxy-service:8000/health

      # --------- API tests (Newman + htmlextra) ----------
      - name: Run API tests (Newman with htmlextra)
        working-directory: tests/postman
        run: |
          mkdir -p reports
          NET="${COMPOSE_PROJECT_NAME}_default"
          docker run --rm \
            --network="$NET" \
            -v "$PWD:/app" -w /app \
            node:20-alpine sh -lc '
              # локальные deps для Node-скрипта + репортёр в те же node_modules
              if [ -f package-lock.json ] || [ -f package.json ]; then
                npm ci || npm i
                npm i newman newman-reporter-htmlextra
              else
                npm i newman newman-reporter-htmlextra
              fi
              # если есть наш раннер — используем его, иначе запускаем newman напрямую
              if [ -f run-tests.js ]; then
                node run-tests.js --environment docker
              else
                # попытка автопоиска коллекции/окружения
                COLL=$(ls -1 *.postman_collection*.json 2>/dev/null | head -n1)
                ENV=$(ls -1 *docker*.postman_environment*.json 2>/dev/null | head -n1)
                [ -z "$COLL" ] && echo "No collection file found" && exit 1
                npx newman run "$COLL" ${ENV:+-e "$ENV"} \
                  -r cli,htmlextra --reporter-htmlextra-export ./reports/report.html
              fi
            '

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: tests/postman/reports

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps postgres monolith movies-service events-service proxy-service || true

      - name: Compose Down
        if: always()
        run: docker compose down -v
