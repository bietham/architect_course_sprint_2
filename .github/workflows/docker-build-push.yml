name: Docker Build, Push & API Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, cinema ]
    paths:
      - 'src/**'
      - 'tests/postman/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  COMPOSE_PROJECT_NAME: cinemaabyss
  NET: cinemaabyss-network
  MONOLITH_IMAGE_NAME: ${{ github.repository }}/monolith
  MOVIES_SERVICE_IMAGE_NAME: ${{ github.repository }}/movies-service
  EVENTS_SERVICE_IMAGE_NAME: ${{ github.repository }}/events-service
  PROXY_SERVICE_IMAGE_NAME: ${{ github.repository }}/proxy-service
  PGUSER: postgres
  PGPASSWORD: postgres_password
  POSTGRES_DB: cinemaabyss

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- metadata (tags/labels) ----------
      - name: Meta - monolith
        id: meta-monolith
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/monolith
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Meta - movies-service
        id: meta-movies
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/movies-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Meta - events-service
        id: meta-events
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/events-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Meta - proxy-service
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/proxy-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      # ---------- build & push ----------
      - name: Build & push - monolith
        uses: docker/build-push-action@v6
        with:
          context: ./src/monolith
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push - movies-service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/movies
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push - events-service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/events
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta-events.outputs.tags }}
          labels: ${{ steps.meta-events.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push - proxy-service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/proxy
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- infra up ----------
      - name: Up Postgres only
        run: docker compose up -d postgres

      - name: Wait for Postgres (DB readiness)
        run: |
          tries=0
          until docker compose exec -T postgres pg_isready -U "$PGUSER" -d "$POSTGRES_DB"; do
            tries=$((tries+1)); [ $tries -gt 60 ] && (docker compose logs --no-color --tail=200 postgres || true; exit 1); sleep 2;
          done

      - name: Up Kafka stack (if present)
        run: docker compose up -d zookeeper kafka || true

      # ---------- services up ----------
      - name: Up services
        run: docker compose up -d --build monolith movies-service events-service proxy-service

      - name: Wait for services health
        run: |
          docker run --rm --network="${NET}" curlimages/curl:8.10.1 -sSf http://monolith:8080/health
          docker run --rm --network="${NET}" curlimages/curl:8.10.1 -sSf http://movies-service:8081/api/movies/health
          docker run --rm --network="${NET}" curlimages/curl:8.10.1 -sSf http://events-service:8082/api/events/health
          docker run --rm --network="${NET}" curlimages/curl:8.10.1 -sSf http://proxy-service:8000/health

      # ---------- API tests ----------
      - name: Run API tests (Newman + htmlextra)
        working-directory: tests/postman
        run: |
          mkdir -p reports
          docker run --rm \
            --network="${NET}" \
            -v "$PWD:/app" -w /app \
            node:20-alpine sh -lc '
              # если есть package.json/run-tests.js — используем его
              if [ -f package-lock.json ] || [ -f package.json ]; then
                npm ci || npm i
              fi
              npm i newman newman-reporter-htmlextra
              if [ -f run-tests.js ]; then
                node run-tests.js --environment docker
              else
                COLL=$(ls -1 *.postman_collection*.json 2>/dev/null | head -n1)
                ENV=$(ls -1 *docker*.postman_environment*.json 2>/dev/null | head -n1)
                [ -z "$COLL" ] && echo "No collection file found" && exit 1
                npx newman run "$COLL" ${ENV:+-e "$ENV"} \
                  -r cli,htmlextra --reporter-htmlextra-export ./reports/report.html
              fi
            '

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: tests/postman/reports

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps postgres monolith movies-service events-service proxy-service || true

      - name: Compose Down
        if: always()
        run: docker compose down -v
