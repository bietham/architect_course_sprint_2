name: Build, Test, and Push (proxy & events)

on:
  push:
    branches: [ main, cinema ]
    paths:
      - 'src/**'
      - 'tests/postman/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  PROXY_IMAGE: ${{ github.repository }}/proxy
  EVENTS_IMAGE: ${{ github.repository }}/events

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Run API tests against docker-compose stack ----------
      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Build & start stack (docker compose)
        run: |
          docker compose up -d --build
          docker ps -a

      - name: Wait for monolith (8080 /health)
        shell: bash
        run: |
          set -e
          for i in {1..120}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health || true)
            if [[ "$code" == "200" ]]; then echo "monolith is up"; exit 0; fi
            sleep 2
          done
          echo "monolith did not become healthy in time"; exit 1

      - name: Wait for movies-service (8081 /api/movies/health)
        shell: bash
        run: |
          set -e
          for i in {1..120}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/api/movies/health || true)
            if [[ "$code" == "200" ]]; then echo "movies-service is up"; exit 0; fi
            sleep 2
          done
          echo "movies-service did not become healthy in time"; exit 1

      - name: Wait for events-service (8082 /api/events/health)
        shell: bash
        run: |
          set -e
          for i in {1..120}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8082/api/events/health || true)
            if [[ "$code" == "200" ]]; then echo "events-service is up"; exit 0; fi
            sleep 2
          done
          echo "events-service did not become healthy in time"; exit 1

      - name: Wait for proxy (8000 /health)
        shell: bash
        run: |
          set -e
          for i in {1..120}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || true)
            if [[ "$code" == "200" ]]; then echo "proxy is up"; exit 0; fi
            sleep 2
          done
          echo "proxy did not become healthy in time"; exit 1

      - name: Run Postman tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test deps & run tests
        working-directory: tests/postman
        run: |
          npm ci
          npm run test:local

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color > compose-logs.txt || true
          tail -n +1 compose-logs.txt | sed -n '1,400p'
        continue-on-error: true

      - name: Tear down stack
        if: always()
        run: |
          docker compose down -v

      # ---------- Build & Push images to GHCR (only if tests are green) ----------
      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # proxy image metadata (tags/labels)
      - name: Meta (proxy)
        id: meta_proxy
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.PROXY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      # events image metadata (tags/labels)
      - name: Meta (events)
        id: meta_events
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.EVENTS_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build & Push proxy (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/proxy
          file: ./src/microservices/proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta_proxy.outputs.tags }}
          labels: ${{ steps.meta_proxy.outputs.labels }}

      - name: Build & Push events (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/events
          file: ./src/microservices/events/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta_events.outputs.tags }}
          labels: ${{ steps.meta_events.outputs.labels }}
