name: Docker Build, Push & API Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, cinema ]
    paths:
      - 'src/**'
      - 'docker-compose.yml'
      - 'tests/postman/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- metadata (tags/labels) ----------
      - name: Meta - monolith
        id: meta-monolith
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/monolith
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short

      - name: Meta - movies-service
        id: meta-movies
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/movies-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short

      - name: Meta - events-service
        id: meta-events
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/events-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short

      - name: Meta - proxy-service
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/proxy-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short

      # ---------- build & push ----------
      - name: Build & push - monolith
        uses: docker/build-push-action@v6
        with:
          context: ./src/monolith
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push - movies-service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/movies
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push - events-service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/events
          push: true
          tags: ${{ steps.meta-events.outputs.tags }}
          labels: ${{ steps.meta-events.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push - proxy-service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- API tests (docker compose + newman) ----------
      - name: Compose Up (db + kafka + services)
        run: |
          docker compose up -d postgres zookeeper kafka
          # поднимаем сервисы (соберёт из локального контекста, если нужно)
          docker compose up -d --build monolith movies-service events-service proxy-service

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services..."
          tries=0
          until curl -sf http://localhost:8080/health; do
            tries=$((tries+1)); [ $tries -gt 40 ] && exit 1; sleep 3;
          done
          until curl -sf http://localhost:8081/api/movies/health; do
            tries=$((tries+1)); [ $tries -gt 40 ] && exit 1; sleep 3;
          done
          # events/proxy могут иметь свои пути здоровья; если нет — ждём порт
          until (echo > /dev/tcp/127.0.0.1/8082) >/dev/null 2>&1; do
            tries=$((tries+1)); [ $tries -gt 40 ] && exit 1; sleep 3;
          done
          until (echo > /dev/tcp/127.0.0.1/8083) >/dev/null 2>&1 || true; do
            tries=$((tries+1)); [ $tries -gt 40 ] && break; sleep 3;
          done

      - name: Build API tests image
        working-directory: tests/postman
        run: |
          docker build -t cinemaabyss-api-tests .

      - name: Run API tests (docker env)
        working-directory: tests/postman
        run: |
          mkdir -p reports
          docker run --network=cinemaabyss-network \
            -v "$(pwd)/reports:/app/reports" \
            cinemaabyss-api-tests --environment docker

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: tests/postman/reports

      - name: Compose Down
        if: always()
        run: docker compose down -v
